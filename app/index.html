<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>USB Ethernet (RTL8153)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="largeIcon.png" alt="">
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="subtitle"></p>
    </div>
  </header>

  <main>
    <section class="card">
      <h2 data-t="status"></h2>
      <table id="status"></table>
    </section>

    <section class="card">
      <h2 data-t="actions"></h2>
      <div class="buttons">
        <button id="btn-load" data-t="load"></button>
        <button id="btn-unload" data-t="unload"></button>
        <button id="btn-auto" data-t="autoOn"></button>
        <button id="btn-primary" data-t="primaryOn"></button>
        <button id="btn-wifi" data-t="wifiOn"></button>
        <button id="btn-speed" data-t="speed"></button>
      </div>
      <p class="hint" data-t="hint"></p>
      <h2 data-t="log"></h2>
      <pre id="log"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
